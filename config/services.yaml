# Katalog 19 serwisów sieci Lexine.
# tier:        1 = flagowy (eporada24), 2 = duży niszowy, 3 = mały niszowy
# cadence_days: minimalna liczba dni między kolejnymi artykułami na tym serwisie
#               (eporada24 najczęściej, serwisy niszowe rzadziej)
# domains:     hasła dziedzinowe pomocne przy routingu / ocenie dopasowania
# category:    domyślna kategoria w breadcrumbs

services:
  eporada24.pl:
    tier: 1
    cadence_days: 2
    category: "Aktualności prawne"
    domains: [ogólne, prawo, konsument, urząd, obywatel, wszystkie dziedziny]

  prawo-pracy.pl:
