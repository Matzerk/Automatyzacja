name: Deploy Gilotynka → GitHub Pages

# Publikuje katalog gilotynka/ jako stronę. Po każdym pushu na main
# (albo gałąź roboczą) strona aktualizuje się sama. Można też odpalić ręcznie.
on:
  push:
    branches: [main, claude/nifty-bell-f6pdlb]
    paths: ['gilotynka/**', '.github/workflows/deploy-gilotynka.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gilotynka          # publikujemy tylko aplikację, nie całe repo
      - id: deployment
        uses: actions/deploy-pages@v4
